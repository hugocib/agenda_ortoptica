# Ortóptica — agenda, registo e relatórios.
# Arranque: docker compose up -d --build   ·   Atualizar: ./atualizar.sh
# As definições de cada servidor (pasta dos dados, porta) ficam no .env, que não vai para o git.
services:
  app:
    build: .
    image: ortoptica-agenda:1.10.0
    container_name: ortoptica-agenda
    restart: unless-stopped
    init: true
    env_file: .env
    environment:
      # Caminhos dentro do contentor; o DATA_DIR do .env só serve para os volumes abaixo.
      DATA_DIR: /data
      BACKUP_DIR: /backups
    volumes:
      # A app corre como utilizador node (uid 1000): as duas pastas têm de lhe pertencer.
      - ${DATA_DIR:-./data}/db:/data            # base de dados SQLite
      - ${DATA_DIR:-./data}/backups:/backups    # cópias de segurança automáticas
    ports:
      - ${APP_PORT:-3000}:3000
